<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Erfan Toolbox 30</title>
<style>
:root{--bg:#090d18;--card:#121d30;--line:#2b3b56;--txt:#eff5ff;--muted:#9eafc9;--a:#55e6c1;--b:#8791ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2c4d,#090d18 60%);color:var(--txt);font-family:Tahoma,Arial,sans-serif;min-height:100vh}header{text-align:center;padding:28px 16px 20px;background:#090d18cc;border-bottom:1px solid var(--line)}.logo{display:grid;place-items:center;width:55px;height:55px;margin:auto auto 10px;border-radius:17px;background:linear-gradient(135deg,var(--a),var(--b));color:#08121c;font-size:28px;font-weight:bold}h1{margin:0 0 8px;font-size:26px}p{color:var(--muted)}header p{margin:0;font-size:13px}.search{max-width:650px;margin:18px auto 0;display:flex;gap:8px}input,textarea,select,button{font:inherit}input,textarea,select{background:#091321;color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:12px;width:100%;outline:none}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;background:linear-gradient(135deg,var(--a),#9af7e3);color:#07131c;font-weight:bold}button.alt{background:#22324c;color:var(--txt);border:1px solid #344966}main{max-width:1100px;margin:auto;padding:18px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.pill{border:1px solid var(--line);background:#121e32;padding:8px 12px;border-radius:50px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px}.tool{min-height:120px;text-align:right;padding:15px;background:linear-gradient(145deg,#17243a,#101827);border:1px solid var(--line);border-radius:16px;color:var(--txt);transition:.2s}.tool:hover{transform:translateY(-3px);border-color:var(--a)}.ico{font-size:25px;margin-bottom:11px}.tool strong{display:block;font-size:13px;margin-bottom:6px}.tool small{color:var(--muted);font-size:11px}.overlay{display:none;position:fixed;inset:0;background:#030711dd;z-index:5;align-items:center;justify-content:center;padding:14px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111b2c;border:1px solid #344763;border-radius:20px;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h2{font-size:18px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.result{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#091321;min-height:44px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.foot{text-align:center;color:#7486a3;font-size:11px;padding:24px}@media(max-width:440px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tool{padding:12px;min-height:110px}h1{font-size:22px}}
</style></head><body>
<header><div class="logo">E</div><h1>Erfan Toolbox <span style="color:var(--a)">30</span></h1><p>جعبه‌ابزار حرفه‌ای فارسی • طراحی واکنش‌گرا • بدون نیاز به اینترنت</p><div class="search"><input id="q" placeholder="جست‌وجوی ابزار..." oninput="render()"><button class="alt" onclick="favsOnly=!favsOnly;render()">★</button></div></header>
<main><div class="stats"><span class="pill">🧰 ۳۰ ابزار</span><span class="pill">🔒 پردازش روی دستگاه</span><span class="pill" id="fc">★ ۰ علاقه‌مندی</span></div><div class="grid" id="grid"></div></main>
<div class="overlay" id="ov" onclick="if(event.target===this)close()"><section class="modal"><div class="head"><h2 id="title"></h2><button class="alt" onclick="close()">✕</button></div><div id="body"></div></section></div><div class="foot">Erfan Toolbox 30 · نسخه وب قابل نصب از طریق مرورگر</div>
<script>
const T=[['🧮','ماشین‌حساب','محاسبه عبارت','calc'],['📏','تبدیل واحد','طول، وزن، دما','units'],['📝','یادداشت','ذخیره روی دستگاه','notes'],['🔐','رمزساز','رمز تصادفی قوی','pass'],['🔤','شمارش متن','کلمه و نویسه','count'],['🔠','تغییر حروف','بزرگ و کوچک انگلیسی','case'],['🎲','تاس و سکه','نتیجه تصادفی','dice'],['🎯','عدد تصادفی','انتخاب از بازه','random'],['％','درصد و تخفیف','محاسبه درصد','percent'],['💸','تقسیم انعام','صورت‌حساب گروهی','tip'],['⏱️','کرنومتر','زمان‌سنج','stopwatch'],['⏲️','تایمر','شمارش معکوس','timer'],['📅','اختلاف تاریخ','فاصله روزها','date'],['🧾','لیست کارها','چک‌لیست ذخیره‌شونده','todo'],['🎨','انتخاب رنگ','HEX و RGB','color'],['🔗','URL Encode','کدگذاری و بازگشایی','url'],['🧬','Base64','تبدیل متن','base64'],['{ }','قالب JSON','مرتب‌سازی JSON','json'],['🧹','پاک‌سازی متن','حذف فاصله‌های اضافه','clean'],['🔁','معکوس متن','برگرداندن متن','reverse'],['🔢','تبدیل مبنا','۲، ۸، ۱۰، ۱۶','base'],['🌐','HTML Escape','تبدیل کاراکترها','html'],['📋','کپی متن','کپی کلیپ‌بورد','copy'],['🔡','شمارش حروف','فراوانی نویسه‌ها','chars'],['🪄','متن نمونه','تولید متن تستی','lorem'],['📦','تبدیل بایت','B تا GB','bytes'],['📐','مساحت مستطیل','مساحت و محیط','area'],['🔺','فیثاغورس','محاسبه وتر','pyth'],['🧠','میانگین‌گیر','میانگین و مجموع','avg'],['💾','دفتر هزینه','ثبت هزینه محلی','expense']];
let fav=JSON.parse(localStorage.getItem('et30fav')||'[]'),favsOnly=false;const $=x=>document.getElementById(x),out='<div class="result" id="out">نتیجه اینجا نمایش داده می‌شود.</div>',I=(id,l,type='text',v='')=>'<div class="field"><label>'+l+'</label><input id="'+id+'" type="'+type+'" value="'+v+'"></div>',B=(s,fn,cl='')=>'<button class="'+cl+'" onclick="'+fn+'">'+s+'</button>';
function render(){let q=$('q').value.toLowerCase();$('grid').innerHTML='';T.forEach(t=>{if((favsOnly&&!fav.includes(t[3]))||(q&&!t.join(' ').toLowerCase().includes(q)))return;let b=document.createElement('button');b.className='tool';b.innerHTML='<div class="ico">'+t[0]+'</div><strong>'+t[1]+(fav.includes(t[3])?' ★':'')+'</strong><small>'+t[2]+'</small>';b.onclick=()=>open(t[3]);$('grid').appendChild(b)});$('fc').textContent='★ '+fav.length+' علاقه‌مندی'}
function open(id){let t=T.find(x=>x[3]===id);$('title').textContent=t[0]+' '+t[1];$('ov').style.display='flex';let h={
calc:I('v','عبارت ریاضی','text','(12+8)*3')+B('محاسبه','calc()')+out,
units:'<div class="field"><label>تبدیل</label><select id="unit"><option value="m">متر به فوت</option><option value="kg">کیلوگرم به پوند</option><option value="c">سلسیوس به فارنهایت</option><option value="km">کیلومتر به مایل</option><option value="cm">سانتی‌متر به اینچ</option></select></div>'+I('v','مقدار','number','10')+B('تبدیل','units()')+out,
notes:'<textarea id="v" rows="5" placeholder="یادداشت..."></textarea>'+B('ذخیره','saveNote()')+'<div id="out" class="result"></div>',
pass:I('v','طول رمز (۴ تا ۶۴)','number','16')+'<label><input id="sym" type="checkbox" checked style="width:auto"> شامل نمادها</label>'+B('ساخت رمز','pass()')+out,
count:'<textarea id="v" rows="5" placeholder="متن..."></textarea>'+B('شمارش','count()')+out,
case:'<textarea id="v" rows="4" placeholder="English text..."></textarea><div class="actions">'+B('UPPERCASE','caseit(0)')+B('lowercase','caseit(1)','alt')+B('Title Case','caseit(2)','alt')+'</div>'+out,
dice:B('🎲 تاس','dice()')+B('🪙 شیر یا خط','coin()','alt')+out,
random:I('a','از','number','1')+I('b','تا','number','100')+B('انتخاب عدد','random()')+out,
percent:'<div class="field"><label>نوع</label><select id="kind"><option value="of">درصد از عدد</option><option value="dis">قیمت پس از تخفیف</option><option value="inc">افزایش درصدی</option></select></div>'+I('a','عدد اصلی','number','250')+I('b','درصد','number','15')+B('محاسبه','percent()')+out,
tip:I('a','مبلغ کل','number','100')+I('b','درصد انعام','number','10')+I('c','تعداد افراد','number','2')+B('محاسبه','tip()')+out,
stopwatch:'<div id="sw" class="result" style="font-size:30px;text-align:center">00:00.0</div>'+B('شروع / توقف','swToggle()')+B('بازنشانی','swReset()','alt'),
timer:I('a','مدت به ثانیه','number','60')+'<div id="tm" class="result">آماده</div>'+B('شروع','timerStart()')+B('توقف','timerStop()','alt'),
date:I('a','تاریخ اول','date')+I('b','تاریخ دوم','date')+B('محاسبه روزها','dateDiff()')+out,
todo:'<div class="row"><input id="v" placeholder="کار جدید">'+B('افزودن','todoAdd()')+'</div><div id="out" class="result"></div>',
color:'<input id="v" type="color" value="#55e6c1" oninput="colorUpdate()" style="height:60px"><div id="preview" style="height:60px;border-radius:12px;background:#55e6c1;margin-top:10px"></div>'+B('نمایش کد','colorUpdate()')+out,
url:'<textarea id="v" rows="4" placeholder="متن یا URL"></textarea>'+B('Encode','urlit(0)')+B('Decode','urlit(1)','alt')+out,
base64:'<textarea id="v" rows="4" placeholder="متن"></textarea>'+B('Encode','b64(0)')+B('Decode','b64(1)','alt')+out,
json:'<textarea id="v" rows="6" placeholder="{&quot;name&quot;:&quot;Erfan&quot;}"></textarea>'+B('قالب‌بندی','jsonit(0)')+B('فشرده','jsonit(1)','alt')+out,
clean:'<textarea id="v" rows="4"></textarea>'+B('پاک‌سازی','clean()')+out,
reverse:'<textarea id="v" rows="4"></textarea>'+B('معکوس','reverse()')+out,
base:I('v','عدد','text','255')+'<div class="field"><label>مبنای ورودی</label><select id="radix"><option value="10">۱۰</option><option value="2">۲</option><option value="8">۸</option><option value="16">۱۶</option></select></div>'+B('تبدیل','base()')+out,
html:'<textarea id="v" rows="4"></textarea>'+B('Escape','htmlit(0)')+B('Unescape','htmlit(1)','alt')+out,
copy:'<textarea id="v" rows="5"></textarea>'+B('کپی متن','copyit()')+out,
chars:'<textarea id="v" rows="4"></textarea>'+B('شمارش نویسه‌ها','chars()')+out,
lorem:I('v','تعداد جمله','number','3')+B('تولید متن','lorem()')+out,
bytes:I('v','مقدار','number','1024')+'<div class="field"><label>واحد ورودی</label><select id="unit"><option value="1">Byte</option><option value="1024">KB</option><option value="1048576">MB</option><option value="1073741824">GB</option></select></div>'+B('تبدیل','bytes()')+out,
area:I('a','طول','number','5')+I('b','عرض','number','3')+B('محاسبه','area()')+out,
pyth:I('a','ضلع اول','number','3')+I('b','ضلع دوم','number','4')+B('محاسبه وتر','pyth()')+out,
avg:'<textarea id="v" rows="4" placeholder="12, 15, 20"></textarea>'+B('محاسبه','avg()')+out,
expense:'<div class="row"><input id="a" placeholder="عنوان هزینه"><input id="b" type="number" placeholder="مبلغ"></div>'+B('ثبت هزینه','expenseAdd()')+B('پاک کردن همه','expenseClear()','alt')+'<div id="out" class="result"></div>'
};$('body').innerHTML=h[id]||'';if(id==='notes')notesLoad();if(id==='todo')todoLoad();if(id==='expense')expenseLoad();if(id==='color')colorUpdate();if(id==='stopwatch')swReset()}
function close(){$('ov').style.display='none';timerStop();clearInterval(swInt)}
function O(s){if($('out'))$('out').textContent=s}function calc(){let s=$('v').value;if(!/^[0-9+\-*/().%\s]+$/.test(s))return O('عبارت نامعتبر');try{let n=Function('"use strict";return ('+s+')')();O(Number.isFinite(n)?n:'نتیجه نامعتبر')}catch(e){O('عبارت را بررسی کن')}}
function units(){let n=+ $('v').value,u=$('unit').value;O(({m:n*3.28084+' فوت',kg:n*2.20462+' پوند',c:(n*9/5+32)+' درجه فارنهایت',km:n*.621371+' مایل',cm:n/2.54+' اینچ'})[u])}
function pass(){let n=Math.max(4,Math.min(64,+$('v').value||16)),c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'+($('sym').checked?'!@#$%&*+-_?':'');let a=new Uint32Array(n);crypto.getRandomValues(a);O(Array.from(a,x=>c[x%c.length]).join(''))}
function count(){let s=$('v').value;O('نویسه با فاصله: '+s.length+'\nبدون فاصله: '+s.replace(/\s/g,'').length+'\nکلمه: '+(s.trim().match(/\S+/g)||[]).length+'\nخط: '+(s?s.split('\n').length:0))}
function caseit(n){let s=$('v').value;O(n===0?s.toUpperCase():n===1?s.toLowerCase():s.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase()))}
function dice(){O('🎲 نتیجه تاس: '+(1+Math.floor(Math.random()*6)))}function coin(){O(Math.random()<.5?'🪙 شیر':'🪙 خط')}
function random(){let a=+$('a').value,b=+$('b').value;if(!Number.isInteger(a)||!Number.isInteger(b)||a>b)return O('بازه را بررسی کن');O(Math.floor(Math.random()*(b-a+1))+a)}
function percent(){let a=+$('a').value,b=+$('b').value,k=$('kind').value;O(k==='of'?a*b/100:k==='dis'?'قیمت نهایی: '+a*(1-b/100)+'\nتخفیف: '+a*b/100:'قیمت نهایی: '+a*(1+b/100))}
function tip(){let a=+$('a').value,b=+$('b').value,c=+$('c').value;if(c<1)return O('تعداد افراد نامعتبر');O('انعام: '+a*b/100+'\nمجموع: '+a*(1+b/100)+'\nسهم هر نفر: '+a*(1+b/100)/c)}
let swStart=0,swElapsed=0,swRun=false,swInt;function swUpdate(){let t=swElapsed+(swRun?Date.now()-swStart:0),s=Math.floor(t/1000);$('sw').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+Math.floor(t%1000/100)}function swToggle(){if(swRun){swElapsed+=Date.now()-swStart;swRun=false;clearInterval(swInt)}else{swStart=Date.now();swRun=true;swInt=setInterval(swUpdate,100)}swUpdate()}function swReset(){swRun=false;swElapsed=0;clearInterval(swInt);if($('sw'))$('sw').textContent='00:00.0'}
let tmInt;function timerStop(){clearInterval(tmInt)}function timerStart(){timerStop();let n=Math.max(0,parseInt($('a').value)||0);if(!n)return $('tm').textContent='مدت معتبر وارد کن';function tick(){ $('tm').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(n--<=0){timerStop();$('tm').textContent='⏰ زمان تمام شد'}}tick();tmInt=setInterval(tick,1000)}
function dateDiff(){let a=new Date($('a').value),b=new Date($('b').value);if(isNaN(a)||isNaN(b))return O('هر دو تاریخ را انتخاب کن');O(Math.abs(Math.round((b-a)/86400000))+' روز')}
function notesLoad(){let a=JSON.parse(localStorage.getItem('et30notes')||'[]');$('out').textContent=a.join('\n\n')||'یادداشتی وجود ندارد'}function saveNote(){let s=$('v').value.trim();if(s){let a=JSON.parse(localStorage.getItem('et30notes')||'[]');a.unshift(s);localStorage.setItem('et30notes',JSON.stringify(a.slice(0,50)));notesLoad()}}
function todoLoad(){let a=JSON.parse(localStorage.getItem('et30todo')||'[]');$('out').innerHTML=a.map((x,i)=>'<div><label><input type="checkbox" '+(x.d?'checked':'')+' onchange="todoCheck('+i+',this.checked)" style="width:auto">'+esc(x.t)+'</label> <button onclick="todoDel('+i+')" class="alt">×</button></div>').join('')||'لیست خالی است'}function todoAdd(){let s=$('v').value.trim();if(!s)return;let a=JSON.parse(localStorage.getItem('et30todo')||'[]');a.push({t:s,d:false});localStorage.setItem('et30todo',JSON.stringify(a));todoLoad()}function todoCheck(i,d){let a=JSON.parse(localStorage.getItem('et30todo')||'[]');a[i].d=d;localStorage.setItem('et30todo',JSON.stringify(a));todoLoad()}function todoDel(i){let a=JSON.parse(localStorage.getItem('et30todo')||'[]');a.splice(i,1);localStorage.setItem('et30todo',JSON.stringify(a));todoLoad()}
function colorUpdate(){let c=$('v').value;$('preview').style.background=c;O('HEX: '+c+'\nRGB: '+[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)).join(', '))}
function urlit(n){try{O(n?decodeURIComponent($('v').value):encodeURIComponent($('v').value))}catch(e){O('متن نامعتبر است')}}function b64(n){try{let s=$('v').value;O(n?decodeURIComponent(escape(atob(s))):btoa(unescape(encodeURIComponent(s))))}catch(e){O('Base64 نامعتبر است')}}
function jsonit(n){try{let s=JSON.stringify(JSON.parse($('v').value),null,n?0:2);$('v').value=s;O('JSON معتبر و مرتب شد')}catch(e){O('JSON نامعتبر: '+e.message)}}function clean(){ $('v').value=$('v').value.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();O($('v').value)}function reverse(){O(Array.from($('v').value).reverse().join(''))}
function base(){let n=parseInt($('v').value,+$('radix').value);if(!Number.isFinite(n))return O('عدد نامعتبر');O('ده‌دهی: '+n+'\nدودویی: '+n.toString(2)+'\nهشت‌هشتی: '+n.toString(8)+'\nشانزدهی: '+n.toString(16).toUpperCase())}
function htmlit(n){let s=$('v').value;O(n?s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'):s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'))}
async function copyit(){try{await navigator.clipboard.writeText($('v').value);O('کپی شد')}catch(e){$('v').select();document.execCommand('copy');O('متن انتخاب و کپی شد')}}
function chars(){let m={};Array.from($('v').value).forEach(c=>m[c]=(m[c]||0)+1);O('تعداد کل: '+$('v').value.length+'\n'+Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,50).map(x=>(x[0]===' '?'␠':x[0])+': '+x[1]).join('\n'))}
function lorem(){let a=['طراحی ابزارهای کاربردی کارهای روزمره را ساده می‌کند.','یک رابط خوب باید سریع و خوانا باشد.','با تمرین می‌توان ایده‌ها را به پروژه تبدیل کرد.','فناوری زمانی ارزشمند است که استفاده از آن آسان باشد.'];let n=Math.max(1,Math.min(10,+$('v').value||3));O(Array.from({length:n},()=>a[Math.floor(Math.random()*a.length)]).join('\n\n'))}
function bytes(){let n=+$('v').value*+$('unit').value;O('Byte: '+n+'\nKB: '+n/1024+'\nMB: '+n/1048576+'\nGB: '+n/1073741824)}
function area(){let a=+$('a').value,b=+$('b').value;O('مساحت: '+a*b+'\nمحیط: '+2*(a+b))}function pyth(){let a=+$('a').value,b=+$('b').value;O('وتر: '+Math.sqrt(a*a+b*b))}
function avg(){let a=$('v').value.split(/[,\s،;]+/).filter(Boolean).map(Number);if(!a.length||a.some(x=>!Number.isFinite(x)))return O('اعداد معتبر وارد کن');O('تعداد: '+a.length+'\nمجموع: '+a.reduce((x,y)=>x+y,0)+'\nمیانگین: '+a.reduce((x,y)=>x+y,0)/a.length+'\nکمینه: '+Math.min(...a)+'\nبیشینه: '+Math.max(...a))}
function expenseLoad(){let a=JSON.parse(localStorage.getItem('et30exp')||'[]');$('out').innerHTML=a.map((x,i)=>'<div>'+esc(x.n)+' — '+Number(x.v).toLocaleString()+' <button class="alt" onclick="expenseDel('+i+')">×</button></div>').join('')+'<hr>جمع: '+a.reduce((s,x)=>s+x.v,0).toLocaleString()}function expenseAdd(){let n=$('a').value.trim(),v=+$('b').value;if(!n||v<0||!Number.isFinite(v))return O('عنوان و مبلغ معتبر وارد کن');let a=JSON.parse(localStorage.getItem('et30exp')||'[]');a.push({n,v});localStorage.setItem('et30exp',JSON.stringify(a));expenseLoad()}function expenseDel(i){let a=JSON.parse(localStorage.getItem('et30exp')||'[]');a.splice(i,1);localStorage.setItem('et30exp',JSON.stringify(a));expenseLoad()}function expenseClear(){if(confirm('همه هزینه‌ها حذف شوند؟')){localStorage.removeItem('et30exp');expenseLoad()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
