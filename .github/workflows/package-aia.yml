name: Package App Inventor AIA
on:
  workflow_dispatch:
  push:
    paths:
      - 'appinventor/**'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package AIA
        run: |
          cd appinventor
          zip -r ../Erfan_Toolbox_30.aia src assets
      - uses: actions/upload-artifact@v4
        with:
          name: Erfan_Toolbox_30-aia
          path: Erfan_Toolbox_30.aia